<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desty | Fashion Store</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <a href="#" class="logo">Destry</a>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Pages</a>
            <a href="#">Blogs</a>
            <a href="#">Contact</a>
        </nav>

        <div class="nav-icons">
            <a href="#" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
            <a href="#" aria-label="Account"><i class="fa-solid fa-user"></i></a>
            <a href="#" aria-label="Wishlist"><i class="fa-regular fa-heart"></i></a>
            <a href="#" aria-label="Shopping cart"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>

        <button class="menu-toggle" aria-label="Open navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero">

            <div class="hero-content">
                <p class="eyebrow">NEW SEASON · NEW STYLE</p>

                <h1>
                    Womens New<br>
                    Collection
                </h1>

                <p class="offer">
                    Up to 70% off selected Product
                </p>

                <a href="#" class="shop-btn">Shop Now</a>
            </div>

            <div class="hero-image">
                <img
                    src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=85"
                    alt="Woman wearing fashionable clothing">
            </div>

        </section>
        <section class="card-1">
        <div class="card-1-overlay">
                <div class="Cd_1">
                    <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner11.jpg" alt="Card 1">
                </div>
                <div class="Cd_3">
                    <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner13.jpg" alt="Card 3">
                </div>
                <div class="Cd_2">
                    <img src="https://dreaming-theme.netlify.app/akasha/assets/images/banner12.jpg" alt="Card 2">
                </div>
          </div></section>
    </main>

    <script>
        const menuButton = document.querySelector(".menu-toggle");
        const navigation = document.querySelector(".nav-links");

        menuButton.addEventListener("click", () => {
            navigation.classList.toggle("active");
        });
    </script>

</body>
</html>
